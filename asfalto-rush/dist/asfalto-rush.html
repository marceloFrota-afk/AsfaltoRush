html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #0b0a14;
  overflow: hidden;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
}

#game-container {
  width: 100vw;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Mantém a pixel art nítida em qualquer escala */
#game-container canvas {
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  outline: none;
}

#boot-error {
  display: none;
  position: fixed;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  max-width: 80vw;
  padding: 16px 20px;
  color: #ffd93d;
  background: #1f1d33;
  border: 2px solid #f7c548;
  font: 14px/1.5 monospace;
  text-align: center;
}
</style>

// ArtCanvas.js — grade de pixels independente do Phaser.

  px(x, y, c) {
    x = Math.round(x); y = Math.round(y);
    if (this.inBounds(x, y)) this.data[y * this.w + x] = c;
    return this;

  rect(x, y, w, h, c) {
    for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) this.px(x + i, y + j, c);

  }

  // Elipse preenchida; colorFn(nx, ny) recebe coordenadas normalizadas (-1..1)
  ellipse(cx, cy, rx, ry, colorOrFn) {
    for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++) {
      for (let x = Math.floor(cx - rx); x <= Math.ceil(cx + rx); x++) {
